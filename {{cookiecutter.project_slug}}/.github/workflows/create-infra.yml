{% raw %}name: Create AWS Infrastructure

on:
  workflow_dispatch:  # 수동 실행만

env:
  AWS_REGION: {% endraw %}{{cookiecutter.aws_region}}{% raw %}
  TERRAFORM_VERSION: 1.5.7
  ENVIRONMENT: demo  # 클라이언트 데모 환경

jobs:
  terraform:
    name: Create Infrastructure with Terraform
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Create Terraform State Bucket
        env:
          TF_STATE_BUCKET: {% endraw %}{{cookiecutter.terraform_state_bucket}}{% raw %}
        run: |
          echo "Checking Terraform state bucket: $TF_STATE_BUCKET"
          if aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "✅ State bucket already exists"
          else
            echo "📦 Creating state bucket: $TF_STATE_BUCKET"
            if [ "${{ env.AWS_REGION }}" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$TF_STATE_BUCKET" \
                --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}
            fi

            aws s3api put-bucket-versioning \
              --bucket "$TF_STATE_BUCKET" \
              --versioning-configuration Status=Enabled

            aws s3api put-public-access-block \
              --bucket "$TF_STATE_BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

            aws s3api put-bucket-encryption \
              --bucket "$TF_STATE_BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

            echo "✅ State bucket created with versioning, encryption, and public access block"
          fi

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="project_name={% endraw %}{{cookiecutter.project_slug}}{% raw %}" \
            -var="environment=demo" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="django_secret_key=${{ secrets.DJANGO_SECRET_KEY }}" \{% endraw %}
{% if cookiecutter.aws_deployment == "ec2-all-in-one" %}{% raw %}
            -var="ec2_public_key=${{ secrets.EC2_SSH_PUBLIC_KEY }}" \{% endraw %}
{% endif %}{% raw %}
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Get Terraform Outputs
        id: output
        working-directory: terraform
        run: |
          APP_URL=$(terraform output -raw app_url)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT{% endraw %}
{% if cookiecutter.aws_deployment == "ecs-fargate" %}{% raw %}
          ECR_URL=$(terraform output -raw ecr_backend_url)
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "📦 ECR URL: $ECR_URL"{% endraw %}
{% endif %}
{% if cookiecutter.aws_deployment == "ec2-all-in-one" %}{% raw %}
          EC2_IP=$(terraform output -raw ec2_public_ip)
          echo "ec2_ip=$EC2_IP" >> $GITHUB_OUTPUT
          echo "🖥️  EC2 IP: $EC2_IP"{% endraw %}
{% endif %}{% raw %}
          echo "🌐 App URL: $APP_URL"
          echo "✅ Infrastructure created successfully!"

      - name: Summary
        run: |{% endraw %}
{% if cookiecutter.aws_deployment == "ecs-fargate" %}{% raw %}
          echo "🎉 AWS Infrastructure (ECS Fargate) created!"
          echo ""
          echo "📦 ECR Repository: ${{ steps.output.outputs.ecr_url }}"
          echo "🌐 Application URL: ${{ steps.output.outputs.app_url }}"
          echo ""
          echo "Next steps:"
          echo "1. Run 'Deploy Application' workflow to deploy your app"
          echo "2. Access your app at: ${{ steps.output.outputs.app_url }}"{% endraw %}
{% endif %}
{% if cookiecutter.aws_deployment == "ec2-all-in-one" %}{% raw %}
          echo "🎉 AWS Infrastructure (EC2 All-in-One) created!"
          echo ""
          echo "🖥️  EC2 IP: ${{ steps.output.outputs.ec2_ip }}"
          echo "🌐 Application URL: ${{ steps.output.outputs.app_url }}"
          echo ""
          echo "Next steps:"
          echo "1. Push to main branch to trigger deployment"
          echo "2. Access your app at: ${{ steps.output.outputs.app_url }}"{% endraw %}
{% endif %}
{% raw %}{% endraw %}
