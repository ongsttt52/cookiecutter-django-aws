{% raw %}name: Deploy Application

on:
  push:
    branches:
      - main  # main 브랜치 push 시 자동 배포
  workflow_dispatch:  # 수동 실행도 가능

env:
  AWS_REGION: {% endraw %}{{cookiecutter.aws_region}}{% raw %}
  PROJECT_NAME: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}
  ECR_BACKEND: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-backend-demo
  ECS_CLUSTER: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-cluster-demo
  ECS_BACKEND_SERVICE: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-backend-service-demo{% endraw %}
{% if cookiecutter.use_frontend == "yes" %}{% raw %}
  ECR_FRONTEND: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-frontend-demo
  ECS_FRONTEND_SERVICE: {% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-frontend-service-demo{% endraw %}
{% endif %}
{% raw %}
jobs:
  # Job 0: 인프라 존재 확인
  check-infrastructure:
    name: Check Infrastructure
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}
    outputs:
      exists: ${{ steps.check.outputs.exists }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check if infrastructure exists
        id: check
        run: |
          echo "🔍 Checking if infrastructure exists..."

          # ECR repository 존재 확인
          if aws ecr describe-repositories \
            --repository-names ${{ env.ECR_BACKEND }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Infrastructure exists - proceeding with deployment"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Infrastructure not found!"
            echo ""
            echo "Please run 'Create AWS Infrastructure' workflow first:"
            echo "  1. Go to Actions tab"
            echo "  2. Select 'Create AWS Infrastructure'"
            echo "  3. Click 'Run workflow'"
            echo ""
            echo "Skipping deployment..."
          fi

{% endraw %}
{% if cookiecutter.backend_stack == "django" %}
{% raw %}  # Job 0.5: 코드 품질 검사 (lint + format + test)
  quality:
    name: Code Quality & Tests
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: test-secret-key-for-ci-only
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      ALLOWED_HOSTS: "*"
      DEBUG: "1"
      ENVIRONMENT: test
      AWS_STORAGE_BUCKET_NAME: test-bucket
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "{% endraw %}{{cookiecutter.python_version}}{% raw %}"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend
        run: uv sync --extra dev

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (black)
        working-directory: backend
        run: uv run black --check .

      - name: Run tests (pytest)
        working-directory: backend
        run: uv run pytest --no-cov -q{% endraw %}
{% endif %}

  # Job 1: Backend Docker 이미지 빌드 & ECR 푸시
  build-backend:
    name: Build and Push Backend Image
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}
    needs: [check-infrastructure{% endraw %}{% if cookiecutter.backend_stack == "django" %}, quality{% endif %}{% raw %}]
    if: needs.check-infrastructure.outputs.exists == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URL
        id: ecr
        run: |
          ECR_URL="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_BACKEND }}"
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "📦 Backend ECR URL: $ECR_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "tags=${{ steps.ecr.outputs.url }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latest=${{ steps.ecr.outputs.url }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: backend
        run: |
          docker buildx build --platform linux/amd64 --load -t ${{ steps.meta.outputs.tags }} .
          docker tag ${{ steps.meta.outputs.tags }} ${{ steps.meta.outputs.latest }}

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}

      - name: Image digest
        run: echo "✅ Backend image pushed - ${{ steps.meta.outputs.tags }}"
{% endraw %}
{% if cookiecutter.use_frontend == "yes" %}
{% raw %}
  # Job 1b: Frontend Docker 이미지 빌드 & ECR 푸시
  build-frontend:
    name: Build and Push Frontend Image
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}
    needs: [check-infrastructure, quality]
    if: needs.check-infrastructure.outputs.exists == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URL
        id: ecr
        run: |
          ECR_URL="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_FRONTEND }}"
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "📦 Frontend ECR URL: $ECR_URL"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        run: |
          IMAGE_TAG=${{ github.sha }}
          echo "tags=${{ steps.ecr.outputs.url }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "latest=${{ steps.ecr.outputs.url }}:latest" >> $GITHUB_OUTPUT

      - name: Build Docker image
        working-directory: frontend
        run: |
          docker buildx build --platform linux/amd64 --load -f Dockerfile.prod -t ${{ steps.meta.outputs.tags }} .
          docker tag ${{ steps.meta.outputs.tags }} ${{ steps.meta.outputs.latest }}

      - name: Push Docker image to ECR
        run: |
          docker push ${{ steps.meta.outputs.tags }}
          docker push ${{ steps.meta.outputs.latest }}

      - name: Image digest
        run: echo "✅ Frontend image pushed - ${{ steps.meta.outputs.tags }}"
{% endraw %}
{% endif %}
{% raw %}
  # Job 2: ECS 서비스 배포
  deploy:
    name: Deploy to ECS
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}
    needs: [check-infrastructure, build-backend{% endraw %}{% if cookiecutter.use_frontend == "yes" %}, build-frontend{% endif %}{% raw %}]
    if: needs.check-infrastructure.outputs.exists == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Force new Backend ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_BACKEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "🚀 Backend deployment triggered"
{% endraw %}
{% if cookiecutter.use_frontend == "yes" %}
{% raw %}
      - name: Force new Frontend ECS deployment
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_FRONTEND_SERVICE }} \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "🚀 Frontend deployment triggered"
{% endraw %}
{% endif %}
{% raw %}
      - name: Wait for Backend service to be stable
        run: |
          echo "⏳ Waiting for Backend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_BACKEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "✅ Backend service is now stable"
{% endraw %}
{% if cookiecutter.use_frontend == "yes" %}
{% raw %}
      - name: Wait for Frontend service to be stable
        run: |
          echo "⏳ Waiting for Frontend service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_FRONTEND_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "✅ Frontend service is now stable"
{% endraw %}
{% endif %}
{% raw %}
      - name: Get ALB URL
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[?contains(LoadBalancerName, `${{ env.PROJECT_NAME }}`)].DNSName' \
            --output text | head -n1)
          APP_URL="http://${ALB_DNS}"
          echo "url=$APP_URL" >> $GITHUB_OUTPUT
          echo "🌐 App URL: $APP_URL"

      - name: Deployment summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo ""
          echo "📦 Backend Image: ${{ needs.build-backend.outputs.image_tag }}"{% endraw %}
{%- if cookiecutter.use_frontend == "yes" %}{% raw %}
          echo "📦 Frontend Image: ${{ needs.build-frontend.outputs.image_tag }}"{% endraw %}
{%- endif %}{% raw %}
          echo "🌐 App URL: ${{ steps.alb.outputs.url }}"
          echo "🔧 ECS Cluster: ${{ env.ECS_CLUSTER }}"
          echo ""
          echo "Access your application at:"
          echo "${{ steps.alb.outputs.url }}"

  # Job 3: 배포 후 헬스체크
  health-check:
    name: Health Check
    runs-on: {% endraw %}{{cookiecutter.github_runner}}{% raw %}
    needs: [check-infrastructure, deploy]
    if: needs.check-infrastructure.outputs.exists == 'true'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB URL
        id: alb
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[?contains(LoadBalancerName, `${{ env.PROJECT_NAME }}`)].DNSName' \
            --output text | head -n1)
          APP_URL="http://${ALB_DNS}"
          echo "url=$APP_URL" >> $GITHUB_OUTPUT
          echo "🌐 Health check URL: $APP_URL"

      - name: Wait for application to start
        run: sleep 30

      - name: Backend health check
        run: |
          APP_URL="${{ steps.alb.outputs.url }}"
          MAX_ATTEMPTS=10
          ATTEMPT=1

          echo "🏥 Starting backend health check for $APP_URL{% endraw %}{{cookiecutter.health_check_path}}{% raw %}"

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL{% endraw %}{{cookiecutter.health_check_path}}{% raw %}" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend health check passed! (HTTP $HTTP_CODE)"
              exit 0
            fi

            echo "⏳ Received HTTP $HTTP_CODE, retrying in 10 seconds..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "⚠️  Backend health check failed after $MAX_ATTEMPTS attempts"
          echo "Check ECS logs:"
          echo "aws logs tail /ecs/{% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-backend-demo --follow"
          exit 1
{% endraw %}
{% if cookiecutter.use_frontend == "yes" %}
{% raw %}
      - name: Frontend health check
        run: |
          APP_URL="${{ steps.alb.outputs.url }}"
          MAX_ATTEMPTS=10
          ATTEMPT=1

          echo "🏥 Starting frontend health check for $APP_URL/"

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Frontend health check passed! (HTTP $HTTP_CODE)"
              echo ""
              echo "🎊 Deployment successful!"
              echo "🌐 Application URL: $APP_URL"
              exit 0
            fi

            echo "⏳ Received HTTP $HTTP_CODE, retrying in 10 seconds..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "⚠️  Frontend health check failed after $MAX_ATTEMPTS attempts"
          echo "Check ECS logs:"
          echo "aws logs tail /ecs/{% endraw %}{{ cookiecutter.project_slug | replace('_', '-') }}{% raw %}-frontend-demo --follow"
          exit 1
{% endraw %}
{% endif %}
